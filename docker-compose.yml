# OSM POI Matchmaker
volumes:
  opm_dbdata:
  opm_osmdata:
  opm_outputdata:
services:
  db:
    image: postgis/postgis:18-3.6
    container_name: opm_db
    environment:
      - POSTGRES_USER=poi
      - POSTGRES_PASSWORD=poitest
      - POSTGRES_DB=poi
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432"
    shm_size: 1G
    volumes:
      - ../container/dbdata-fresh:/var/lib/postgresql/data/
      - ${PWD}/osm2pgsql/postgresql.conf:/etc/postgresql/postgresql.conf
    restart: on-failure
    oom_score_adj: -100
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
  osm_load_app:
    image: osm_loader:latest
    container_name: opm_osm_load_app
    environment:
      - PGPASSWORD=poitest
      - OSM2PGSQL_VERSION=1.6.0
    volumes:
      - ../container/osmdata:/opm/osm
    depends_on:
      - db
    restart: on-failure
    oom_score_adj: -100
    mem_limit: 4g
  poi_load_app:
    image: osm_poi_matchmaker:latest
    container_name: opm_poi_load_app
    ports:
      - "4678:5678"
    volumes:
      - ../container/osmdata:/opm/osm
      - ../container/importdata:/opm/osm_poi_matchmaker/output
      - ../container/downloaddata:/opm/osm_poi_matchmaker/cache_url
    depends_on:
      db:
        condition: service_started
      # osm_load_app only starting isn't enough - without waiting for it to actually
      # finish, harvesting can begin querying planet_osm_point/polygon/line before
      # osm2pgsql has created (or fully populated) them, causing UndefinedTable errors
      # early in STAGE 2 and silent zero-result city/address lookups for whichever
      # providers happen to run in that window.
      osm_load_app:
        condition: service_completed_successfully
    restart: on-failure
    oom_score_adj: -100
    mem_limit: 10g
    cap_add:
      - SYS_PTRACE
    pid: host
